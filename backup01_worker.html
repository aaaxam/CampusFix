<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>工作人员中心 - CampusFix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        /* 导航栏 */
        .navbar {
            height: 70px;
            background: white;
            padding: 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #1677ff;
            text-decoration: none;
            cursor: pointer;
        }

        .worker {
            color: #888;
            margin-right: 20px;
            font-size: 14px;
        }

        .logout {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .logout:hover {
            color: #1677ff;
        }

        /* 主容器 */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        /* 数据统计 */
        .stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #1677ff;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
        }

        /* 已取消统计 */
        .cancelled-number {
            color: #999;
        }

        /* 数据看板 */
        .dashboard {
            margin-bottom: 25px;
        }

        .dashboard-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .dashboard-card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .dashboard-stat {
            font-size: 28px;
            font-weight: bold;
            color: #1677ff;
        }

        .dashboard-subtitle {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }

        /* 数据条 */
        .chart-item {
            margin-bottom: 16px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .chart-name {
            color: #555;
        }

        .chart-count {
            color: #888;
        }

        .chart-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .chart-fill {
            height: 100%;
            background: #1677ff;
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* 筛选 */
        .filter-box {
            background: white;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .filter-box label {
            margin-right: 10px;
            color: #555;
            font-size: 14px;
        }

        .filter-box select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            background: white;
        }

        /* 订单卡片 */
        .order-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .order-id {
            color: #1677ff;
            text-decoration: none;
            font-weight: bold;
        }

        .order-id:hover {
            text-decoration: underline;
        }

        /* 已取消订单编号 */
        .order-id-cancelled {
            color: #999;
            cursor: default;
        }

        .order-id-cancelled:hover {
            text-decoration: none;
        }

        .status {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            background: #f0f5ff;
            color: #1677ff;
        }

        .status-cancelled {
            background: #f5f5f5;
            color: #999;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
        }

        .label {
            color: #999;
        }

        .description {
            grid-column: 1 / -1;
            line-height: 1.7;
        }

        /* 优先级 */
        .priority-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        .priority-normal {
            background: #f0f9eb;
            color: #52a34a;
        }

        .priority-urgent {
            background: #fff7e6;
            color: #d48806;
        }

        .priority-high {
            background: #fff1f0;
            color: #cf1322;
        }

        /* 接受订单按钮 */
        .accept-btn {
            width: 100%;
            border: none;
            background: #1677ff;
            color: white;
            padding: 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }

        .accept-btn:hover {
            background: #0958d9;
        }

        /* 已完成 */
        .completed-text {
            color: #52a34a;
            font-size: 14px;
            margin-top: 12px;
        }

        /* 已取消 */
        .cancelled-text {
            color: #999;
            font-size: 14px;
            margin-top: 12px;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        /* 评价 */
        .review-box {
            margin-top: 18px;
            padding: 18px;
            background: #f8f9fb;
            border-radius: 10px;
        }

        .review-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .review-rating {
            margin-bottom: 8px;
        }

        .review-content {
            color: #666;
            line-height: 1.7;
            font-size: 14px;
        }

        /* 空状态 */
        .empty {
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            text-align: center;
            color: #999;
        }

        /* 响应式 */
        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 800px) {

            .navbar {
                padding: 0 20px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .info {
                grid-template-columns: 1fr;
            }

            .description {
                grid-column: auto;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .container {
                margin-top: 25px;
            }

            .title {
                font-size: 25px;
            }

            .worker {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- 导航栏 -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            🖥️ CampusFix
        </a>

        <div>
            <span class="worker">
                工作人员中心
            </span>

            <a
                href="index.html"
                class="logout"
                onclick="logout();"
            >
                退出登录
            </a>
        </div>

    </nav>


    <main class="container">

        <h1 class="title">
            工作人员中心
        </h1>


        <!-- 基础统计 -->
        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="total"
                >
                    0
                </div>

                <div class="stat-label">
                    总订单
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="pending"
                >
                    0
                </div>

                <div class="stat-label">
                    待接单
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="accepted"
                >
                    0
                </div>

                <div class="stat-label">
                    已接单
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="waitingReview"
                >
                    0
                </div>

                <div class="stat-label">
                    待评价
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="completed"
                >
                    0
                </div>

                <div class="stat-label">
                    已完成
                </div>

            </div>


            <!-- 新增：已取消 -->

            <div class="stat">

                <div
                    class="stat-number cancelled-number"
                    id="cancelled"
                >
                    0
                </div>

                <div class="stat-label">
                    已取消
                </div>

            </div>

        </div>


        <!-- 数据看板 -->
        <section class="dashboard">

            <div class="dashboard-title">
                维修数据概览
            </div>

            <div class="dashboard-grid">


                <!-- 完成率 -->

                <div class="dashboard-card">

                    <div class="dashboard-card-title">
                        维修完成情况
                    </div>

                    <div
                        class="dashboard-stat"
                        id="completionRate"
                    >
                        0%
                    </div>

                    <div class="dashboard-subtitle">
                        已完成订单占有效维修订单的比例
                    </div>

                </div>


                <!-- 平均评分 -->

                <div class="dashboard-card">

                    <div class="dashboard-card-title">
                        学生评价
                    </div>

                    <div
                        class="dashboard-stat"
                        id="averageRating"
                    >
                        暂无
                    </div>

                    <div class="dashboard-subtitle">
                        已评价订单平均评分
                    </div>

                </div>


                <!-- 故障类型 -->

                <div class="dashboard-card">

                    <div class="dashboard-card-title">
                        故障类型分布
                    </div>

                    <div id="typeChart"></div>

                </div>


                <!-- 优先级 -->

                <div class="dashboard-card">

                    <div class="dashboard-card-title">
                        订单优先级分布
                    </div>

                    <div id="priorityChart"></div>

                </div>

            </div>

        </section>


        <!-- 订单筛选 -->

        <div class="filter-box">

            <label for="statusFilter">
                订单状态：
            </label>

            <select
                id="statusFilter"
                onchange="filterOrders()"
            >

                <option value="全部">
                    全部订单
                </option>

                <option value="待接单">
                    待接单
                </option>

                <option value="已接单">
                    已接单
                </option>

                <option value="待评价">
                    待评价
                </option>

                <option value="已完成">
                    已完成
                </option>

                <option value="已取消">
                    已取消
                </option>

            </select>

        </div>


        <!-- 订单列表 -->

        <div id="orders"></div>

    </main>


    <script>

        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        const ordersContainer =
            document.getElementById("orders");


        /* =========================
           基础统计
        ========================= */

        function updateStats() {

            /* 总订单 */

            document.getElementById("total").textContent =
                orders.length;


            /* 待接单 */

            const pending =
                orders.filter(
                    order =>
                        order.status === "待接单"
                ).length;


            /* 已接单 */

            const accepted =
                orders.filter(
                    order =>
                        order.status === "已接单"
                ).length;


            /* 待评价 */

            const waitingReview =
                orders.filter(
                    order =>
                        order.status === "待评价"
                ).length;


            /* 已完成 */

            const completed =
                orders.filter(
                    order =>
                        order.status === "已完成"
                ).length;


            /* 已取消 */

            const cancelled =
                orders.filter(
                    order =>
                        order.status === "已取消"
                ).length;


            document.getElementById("pending").textContent =
                pending;

            document.getElementById("accepted").textContent =
                accepted;

            document.getElementById("waitingReview").textContent =
                waitingReview;

            document.getElementById("completed").textContent =
                completed;

            document.getElementById("cancelled").textContent =
                cancelled;


            /* =========================
               完成率

               已取消订单不计入有效维修订单
            ========================= */

            const validOrders =
                orders.length - cancelled;


            const completionRate =
                validOrders > 0
                    ? Math.round(
                        completed /
                        validOrders *
                        100
                    )
                    : 0;


            document.getElementById(
                "completionRate"
            ).textContent =
                completionRate + "%";


            /* =========================
               平均评分
            ========================= */

            const ratedOrders =
                orders.filter(
                    order =>
                        Number(order.rating) > 0
                );


            if (
                ratedOrders.length > 0
            ) {

                const totalRating =
                    ratedOrders.reduce(
                        (sum, order) =>
                            sum +
                            Number(order.rating),
                        0
                    );


                const average =
                    (
                        totalRating /
                        ratedOrders.length
                    ).toFixed(1);


                document.getElementById(
                    "averageRating"
                ).textContent =
                    average + " / 5";

            } else {

                document.getElementById(
                    "averageRating"
                ).textContent =
                    "暂无";

            }

        }


        /* =========================
           数据看板
        ========================= */

        function updateDashboard() {

            /* =====================
               故障类型
            ===================== */

            const typeCounts = {};


            orders.forEach(order => {

                const type =
                    order.type || "其他";


                typeCounts[type] =
                    (typeCounts[type] || 0) + 1;

            });


            const typeChart =
                document.getElementById(
                    "typeChart"
                );


            const typeValues =
                Object.values(
                    typeCounts
                );


            const maxTypeCount =
                Math.max(
                    ...typeValues,
                    1
                );


            if (
                Object.keys(typeCounts).length === 0
            ) {

                typeChart.innerHTML =
                    `
                        <div
                            style="
                                color:#999;
                                font-size:14px;
                            "
                        >
                            暂无订单数据
                        </div>
                    `;

            } else {

                typeChart.innerHTML =
                    Object.entries(typeCounts)
                        .map(
                            ([type, count]) => {

                                const width =
                                    Math.round(
                                        count /
                                        maxTypeCount *
                                        100
                                    );


                                return `
                                    <div class="chart-item">

                                        <div class="chart-header">

                                            <span class="chart-name">
                                                ${type}
                                            </span>

                                            <span class="chart-count">
                                                ${count} 单
                                            </span>

                                        </div>


                                        <div class="chart-bar">

                                            <div
                                                class="chart-fill"
                                                style="width:${width}%"
                                            ></div>

                                        </div>

                                    </div>
                                `;

                            }
                        )
                        .join("");

            }


            /* =========================
               优先级统计
            ========================= */

            const priorityCounts = {

                "普通": 0,

                "紧急": 0,

                "非常紧急": 0

            };


            orders.forEach(order => {

                const priority =
                    order.priority || "普通";


                if (
                    priorityCounts[priority]
                    !== undefined
                ) {

                    priorityCounts[priority]++;

                } else {

                    priorityCounts["普通"]++;

                }

            });


            const priorityChart =
                document.getElementById(
                    "priorityChart"
                );


            const maxPriorityCount =
                Math.max(
                    ...Object.values(
                        priorityCounts
                    ),
                    1
                );


            priorityChart.innerHTML =
                Object.entries(
                    priorityCounts
                )
                .map(
                    ([priority, count]) => {

                        const width =
                            Math.round(
                                count /
                                maxPriorityCount *
                                100
                            );


                        let icon = "🟢";


                        if (
                            priority === "紧急"
                        ) {

                            icon = "🟠";

                        }


                        if (
                            priority === "非常紧急"
                        ) {

                            icon = "🔴";

                        }


                        return `
                            <div class="chart-item">

                                <div class="chart-header">

                                    <span class="chart-name">
                                        ${icon}
                                        ${priority}
                                    </span>

                                    <span class="chart-count">
                                        ${count} 单
                                    </span>

                                </div>


                                <div class="chart-bar">

                                    <div
                                        class="chart-fill"
                                        style="width:${width}%"
                                    ></div>

                                </div>

                            </div>
                        `;

                    }
                )
                .join("");

        }


        /* =========================
           渲染订单
        ========================= */

        function renderOrders() {

            if (
                orders.length === 0
            ) {

                ordersContainer.innerHTML = `
                    <div class="empty">
                        暂时没有维修订单
                    </div>
                `;

                return;

            }


            renderFilteredOrders(
                orders
            );

        }


        function renderFilteredOrders(
            filteredOrders
        ) {

            if (
                filteredOrders.length === 0
            ) {

                ordersContainer.innerHTML = `
                    <div class="empty">
                        当前状态下没有订单
                    </div>
                `;

                return;

            }


            ordersContainer.innerHTML =

                filteredOrders
                    .map(order => {


                        const index =
                            orders.findIndex(
                                item =>
                                    item.id ===
                                    order.id
                            );


                        /* =====================
                           优先级
                        ===================== */

                        const priority =
                            order.priority ||
                            "普通";


                        let priorityClass =
                            "priority-normal";


                        let priorityText =
                            "🟢 普通";


                        if (
                            priority === "紧急"
                        ) {

                            priorityClass =
                                "priority-urgent";


                            priorityText =
                                "🟠 紧急";

                        }


                        if (
                            priority === "非常紧急"
                        ) {

                            priorityClass =
                                "priority-high";


                            priorityText =
                                "🔴 非常紧急";

                        }


                        /* =====================
                           订单编号
                        ===================== */

                        const orderTitle =

                            order.status === "已取消"

                            ?

                            `
                                <span
                                    class="
                                        order-id
                                        order-id-cancelled
                                    "
                                >
                                    订单 #${order.id}
                                </span>
                            `

                            :

                            `
                                <a
                                    href="
                                        worker-order.html?id=${order.id}
                                    "
                                    class="order-id"
                                >
                                    订单 #${order.id}
                                </a>
                            `;



                        /* =====================
                           订单卡片
                        ===================== */

                        return `

                            <div class="order-card">


                                <div class="order-header">

                                    ${orderTitle}


                                    <span
                                        class="
                                            status
                                            ${
                                                order.status ===
                                                "已取消"
                                                ?
                                                "status-cancelled"
                                                :
                                                ""
                                            }
                                        "
                                    >
                                        ${order.status}
                                    </span>

                                </div>



                                <div class="info">


                                    <div>

                                        <span class="label">
                                            学生账号：
                                        </span>

                                        ${order.username || "未知"}

                                    </div>


                                    <div>

                                        <span class="label">
                                            故障类型：
                                        </span>

                                        ${order.type || "未填写"}

                                    </div>


                                    <div>

                                        <span class="label">
                                            预约时间：
                                        </span>

                                        ${order.appointmentTime || "未填写"}

                                    </div>


                                    <div>

                                        <span class="label">
                                            维修地点：
                                        </span>

                                        ${order.location || "未填写"}

                                    </div>


                                    <div>

                                        <span class="label">
                                            联系方式：
                                        </span>

                                        ${order.phone || "未填写"}

                                    </div>


                                    <div class="description">

                                        <span class="label">
                                            故障描述：
                                        </span>

                                        ${order.description || "未填写"}

                                    </div>

                                </div>



                                <!-- 优先级 -->

                                <div
                                    class="
                                        priority-badge
                                        ${priorityClass}
                                    "
                                >
                                    ${priorityText}
                                </div>



                                <!-- 待接单 -->

                                ${
                                    order.status ===
                                    "待接单"

                                    ?

                                    `
                                        <button
                                            class="accept-btn"
                                            onclick="
                                                acceptOrder(${index})
                                            "
                                        >
                                            接受订单
                                        </button>
                                    `

                                    :

                                    ""
                                }



                                <!-- 已接单 -->

                                ${
                                    order.status ===
                                    "已接单"

                                    ?

                                    `
                                        <div
                                            style="
                                                color:#1677ff;
                                                font-size:14px;
                                                margin-top:12px;
                                            "
                                        >
                                            当前工作人员：
                                            ${
                                                order.worker ||
                                                "工作人员"
                                            }
                                        </div>


                                        <div
                                            style="
                                                color:#888;
                                                font-size:13px;
                                                margin-top:8px;
                                            "
                                        >
                                            点击订单编号进入维修详情
                                        </div>
                                    `

                                    :

                                    ""
                                }



                                <!-- 待评价 -->

                                ${
                                    order.status ===
                                    "待评价"

                                    ?

                                    `
                                        <div
                                            class="completed-text"
                                        >
                                            ✓ 维修已完成，
                                            等待学生评价
                                        </div>
                                    `

                                    :

                                    ""
                                }



                                <!-- 已完成 -->

                                ${
                                    order.status ===
                                    "已完成"

                                    ?

                                    `
                                        <div
                                            class="completed-text"
                                        >
                                            ✓ 订单已完成
                                        </div>


                                        ${
                                            Number(
                                                order.rating
                                            ) > 0

                                            ?

                                            `
                                                <div
                                                    class="review-box"
                                                >

                                                    <div
                                                        class="
                                                            review-title
                                                        "
                                                    >
                                                        ⭐ 学生评价
                                                    </div>


                                                    <div
                                                        class="
                                                            review-rating
                                                        "
                                                    >

                                                        ${
                                                            "⭐".repeat(
                                                                Number(
                                                                    order.rating
                                                                )
                                                            )
                                                        }


                                                        <span
                                                            style="
                                                                color:#888;
                                                                font-size:14px;
                                                                margin-left:8px;
                                                            "
                                                        >
                                                            ${
                                                                order.rating
                                                            }
                                                            / 5
                                                        </span>

                                                    </div>


                                                    <div
                                                        class="
                                                            review-content
                                                        "
                                                    >

                                                        ${
                                                            order.review ||
                                                            "学生未填写评价内容"
                                                        }

                                                    </div>

                                                </div>
                                            `

                                            :

                                            ""
                                        }

                                    `

                                    :

                                    ""
                                }



                                <!-- 已取消 -->

                                ${
                                    order.status ===
                                    "已取消"

                                    ?

                                    `
                                        <div
                                            class="
                                                cancelled-text
                                            "
                                        >
                                            🚫
                                            学生已取消本次维修预约，
                                            该订单不会继续进入维修流程。
                                        </div>
                                    `

                                    :

                                    ""
                                }


                            </div>

                        `;

                    })
                    .join("");

        }


        /* =========================
           筛选订单
        ========================= */

        function filterOrders() {

            const filter =
                document.getElementById(
                    "statusFilter"
                ).value;


            if (
                filter === "全部"
            ) {

                renderOrders();

                return;

            }


            const filteredOrders =
                orders.filter(
                    order =>
                        order.status ===
                        filter
                );


            renderFilteredOrders(
                filteredOrders
            );

        }


        /* =========================
           接受订单
        ========================= */

        function acceptOrder(index) {

            const order =
                orders[index];


            if (!order) {

                alert("订单不存在！");

                return;

            }


            /* 安全检查 */

            if (
                order.status !==
                "待接单"
            ) {

                alert(
                    "该订单已经被处理！"
                );

                return;

            }


            order.status =
                "已接单";


            order.worker =
                "工作人员";


            localStorage.setItem(
                "orders",
                JSON.stringify(orders)
            );


            alert(
                "订单接受成功！"
            );


            updateStats();

            updateDashboard();

            filterOrders();

        }


        /* =========================
           页面初始化
        ========================= */

        updateStats();

        updateDashboard();

        renderOrders();

    </script>


    <!-- 登录权限验证 -->

    <script src="auth.js"></script>

    <script>

        checkLogin("worker");

    </script>

</body>

</html>
