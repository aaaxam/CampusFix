<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>登录 - 校园电脑维护预约系统</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 登录框 */
        .login-box {

            width: 400px;

            max-width: calc(100% - 40px);

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }


        /* Logo */
        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        /* 副标题 */
        .subtitle {

            text-align: center;

            color: #888;

            margin-bottom: 30px;
        }


        /* 输入框区域 */
        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {

            border-color: #1677ff;
        }


        /* 登录按钮 */
        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1677ff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #0958d9;
        }


        /* 返回首页 */
        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }


        .back:hover {

            color: #1677ff;
        }


        /* 手机端 */
        @media (max-width: 600px) {

            .login-box {

                padding: 30px 25px;
            }

            .logo {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            🖥️ CampusFix
        </div>


        <div class="subtitle">
            校园电脑维护预约系统
        </div>


        <!-- 账号 -->
        <div class="form-group">

            <label>
                账号
            </label>

            <input
                type="text"
                placeholder="请输入学号"
            >

        </div>


        <!-- 密码 -->
        <div class="form-group">

            <label>
                密码
            </label>

            <input
                type="password"
                placeholder="请输入密码"
            >

        </div>


        <!-- 登录按钮 -->
        <button
            class="login-btn"
            onclick="login()"
        >
            登录
        </button>


        <!-- 返回首页 -->
        <a
            href="index.html"
            class="back"
        >
            ← 返回首页
        </a>


    </div>


    <!-- 登录功能 -->
    <script>

        function login() {

            // 获取账号
            const username =
                document.querySelector(
                    'input[type="text"]'
                ).value;


            // 获取密码
            const password =
                document.querySelector(
                    'input[type="password"]'
                ).value;


            // 判断有没有填写
            if (
                username === "" ||
                password === ""
            ) {

                alert("请输入账号和密码");

                return;
            }


            // 学生账号
            if (
                username === "student" &&
                password === "123456"
            ) {

                alert("学生登录成功！");

                window.location.href =
                    "student.html";

                return;
            }


            // 工作人员账号
            if (
                username === "worker" &&
                password === "123456"
            ) {

                alert("工作人员登录成功！");

                window.location.href =
                    "worker.html";

                return;
            }


            // 登录失败
            alert("账号或密码错误");

        }

    </script>


</body>

</html>
