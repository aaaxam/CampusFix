<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>登录 - CampusFix</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            background: #f5f7fa;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-box {

            width: 400px;

            max-width: calc(100% - 40px);

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1677ff;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #999;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #555;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #1677ff;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1677ff;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #0958d9;

        }


        .demo {

            margin-top: 25px;

            padding: 15px;

            background: #f6f8fa;

            border-radius: 8px;

            font-size: 13px;

            color: #666;

            line-height: 1.8;

        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1677ff;

            text-decoration: none;

            font-size: 14px;

        }

        .register-link {
            text-align: center;
            margin-top: 18px;
            color: #888;
        }

        .register-link a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }


        @media (max-width: 600px) {

            .login-box {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">

            🖥️ CampusFix

        </div>


        <div class="subtitle">

            校园电脑维护预约系统

        </div>


        <div class="form-group">

            <label>
                账号
            </label>

            <input
                type="text"
                id="username"
                placeholder="请输入账号"
            >

        </div>


        <div class="form-group">

            <label>
                密码
            </label>

            <input
                type="password"
                id="password"
                placeholder="请输入密码"
            >

        </div>


        <button onclick="login()">

            登录

        </button>

        <div class="register-link">
            还没有账号？
            <a href="register.html">
                立即注册
            </a>
        </div>


        <div class="demo">

            <strong>
                演示账号
            </strong>

            <br>

            学生账号：
            student / 123456

            <br>

            工作人员：
            worker / 123456

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← 返回首页
        </a>


    </div>


    <script>


        function login() {


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value.trim();


            // 检查是否为空

            if (
                !username ||
                !password
            ) {

                alert(
                    "请输入账号和密码！"
                );

                return;

            }


            // 学生登录

            if (
                username === "student" &&
                password === "123456"
            ) {


                // 保存登录身份

                localStorage.setItem(
                    "userRole",
                    "student"
                );

                localStorage.setItem(
                    "username",
                    username
                );


                alert(
                    "学生登录成功！"
                );


                window.location.href =
                    "student.html";


                return;

            }


            // 工作人员登录

            if (
                username === "worker" &&
                password === "123456"
            ) {


                // 保存登录身份

                localStorage.setItem(
                    "userRole",
                    "worker"
                );

                localStorage.setItem(
                    "username",
                    username
                );


                alert(
                    "工作人员登录成功！"
                );


                window.location.href =
                    "worker.html";


                return;

            }


            const users =
                JSON.parse(
                    localStorage.getItem("users")||"[]"
                );


            const user = 
                users.find(
                    user =>
                        user.username === username &&
                        user.password === password
                );


            if (user){

                localStorage.setItem(
                    "userRole",
                    user.role

                );

                localStorage.setItem(
                    "username",
                    user.username
                );

                alert(
                    "登录成功！"
                );

                window.location.href = 
                    "student.html";

                return;

            }


            // 登录失败

            alert(
                "账号或密码错误！"
            );

        }

    </script>


</body>

</html>
